    <style>
        .card {
            width: 200px;
            height: 480px;
            margin: 10px;
            perspective: 1000px;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            position: relative;
            border: none;
            background: transparent;
        }

        .card.is-flipped {
            transform: rotateY(180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border: 1px solid rgba(0,0,0,.125);
            border-radius: .375rem;
            background: white;
            padding: 8px;
            top: 0;
            left: 0;
        }

        .back {
            transform: rotateY(180deg);
            background-color: #f8f9fa;
            overflow-y: auto;
        }

        .card-img-top {
        width: 100%;
        object-fit: cover;
        }

        .card-title {
        font-size: 1rem;
        }

        .card-text {
        font-size: 0.8rem;
        }

        .download_movie {
        font-size: 1.2rem;
        padding: 5px;
        width: 40%;
        }

        .play_movie {
        font-size: 1.2rem;
        padding: 5px;
        width: 40%;
        }

        .open_series {
        font-size: 1.2rem;
        padding: 5px;
        }

        .ribbon {
        font-size: 12px;
        font-weight: bold;
        color: #fff;
        position: absolute;
        top: 0;
        right: 0;
        line-height: 1.8;
        padding-inline: 1lh;
        clip-path: polygon(
            100% 100%,0 100%,999px calc(100% - 999px),calc(100% - 999px) calc(100% - 999px));
        transform: translate(calc((1 - cos(45deg))*100%), -100%) rotate(45deg);
        transform-origin: 0% 100%;
        }

        .blue {
            background-color: #1571bd; /* the main color  */
        }

        .purple {
            background-color: #BD1550; /* the main color  */
        }

        .green {
            background-color: #387505; /* the main color  */
        }
    </style>
</head>

function getCountryName (countryCode) {
    if (isoCountries.hasOwnProperty(countryCode)) {
        return isoCountries[countryCode];
    } else {
        return countryCode;
    }
}

function generateCountryDropdown() {
    const countries = [
        "All Countries", "Arabic", "Brazil", "English", 
        "French", "India", "Italy", "Japan", "Portugal", "Spain"
    ];
    
    const dropdown = document.getElementById('countryDropdown');
    const dropdownMenu = dropdown.nextElementSibling;
    
    // Clear existing items
    dropdownMenu.innerHTML = '';
    
    // Add new items
    countries.forEach(country => {
        const item = document.createElement('li');
        item.innerHTML = `
            <a class="dropdown-item" href="#" 
               onclick="updateDropDownButtonLabel('${country}')">
                ${country}
            </a>
        `;
        dropdownMenu.appendChild(item);
    });
}

/**
 * Changes a abbreviated name of a country or region and returns the longer
 * version
 * @param {string} short Abbreviated name of a country or region
 * @returns Long name of the country or region
 */
function shortToLongLanguage(short) {
    ret_value = "";
    switch (short) {
        case "AR": ret_value = "Arabic"; break;
        case "ALB": ret_value = "Albania"; break;
        case "BR": ret_value = "Brazil"; break;
        case "EN": ret_value = "English"; break;
        case "FR": ret_value = "French"; break;
        case "IN": ret_value = "India"; break;
        case "IT": ret_value = "Italian"; break;
        case "JP": ret_value = "Japan"; break;
        case "PT": ret_value = "Portugal"; break;
        case "ES": ret_value = "Spain"; break;
        case "TR": ret_value = "Turkey"; break;
        default:
            ret_value = short;
    }
    return ret_value;
};

function convertUnixTimeToHumanReadable(unixTimestamp) {
  // Convert to milliseconds
  const milliseconds = unixTimestamp * 1000; 

  // Create a Date object
  const date = new Date(milliseconds);

  // Format the date and time
  const formattedDate = date.toLocaleDateString(); 
  const formattedTime = date.toLocaleTimeString(); 

  // Return the formatted string
  return `${formattedDate}`;
}

function htmlToElement(html) {
    var template = document.createElement('template');
    template.innerHTML = html.trim();
    return template.content.firstChild; // Return the actual element
}

 * @param {string} item JSON string contining the data for one stream
 * @returns string with the formatted HTML card for the stream

    var card_info = "";

            }

            var stream_icon = item.stream_icon;
            var is_adult = (item.is_adult == "1");
            var stream_extension = item.container_extension;
            var stream_url = item.url;
            var stream_type = item.stream_type;
            var stream_added = convertUnixTimeToHumanReadable(item.added);

        case undefined:
            // If stream_id is undefined, it is not a Movie, it is a Series

            var stream_icon = item.cover;
            var stream_type = "series";
            var stream_added = convertUnixTimeToHumanReadable(item.added);
            break;
        default:
            // Not sure if we ever go into here
            console.log("Unknown");
            console.log(item);
            var stream_type = "";
    }
    var stream_name = item.name.split("|");
    if (stream_name.length > 1) {
        var stream_title = stream_name[1].trim();
        var stream_country = getCountryName(stream_name[0].trim());
    } else {
        var stream_title = stream_name[0].trim();
        var stream_country = ""

        card_front.querySelector('.play_movie').setAttribute("movie_extension", stream_extension);
        card_front.querySelector('.download_movie').setAttribute("movie_id", stream_id);
    }

    card_info = "ID: " + stream_id + "<br>Added on: " + stream_added;
    if (stream_country != "")
    {
        card_info = card_info.replace("<br>"," [" + stream_country + "]<br>");
    }
    card_front.querySelector('.card-text').innerHTML = card_info

    if (is_adult)
    {
        card_front.classList.add("border-danger");
        card_front.querySelector(".card-body").classList.add("text-danger");
    }

    if (page_country == undefined)
        return card;

    if ((page_country == shortToLongLanguage(stream_country)) || (page_country == "All Countries") || (page_country == ""))
        return card;

    return "";
}

/**
 * Send search string to server, get the result, and prepare output in search_result element
 * @param {integer} page number
 */
async function fetchSearchResults(search_string)
{
    // Exit if search string is empty
    if (document.getElementById("searchString_INPUT").value == "")
        return ""

    url = API_BASE_URL + "/stream_search/" + document.getElementById("searchString_INPUT").value

    if (document.getElementById("searchStringType_INPUT").value != "")
    {
        url = url + "/" + document.getElementById("searchStringType_INPUT").value
    }

    isLoading = true; // Set loading flag
    const response = await fetch(url);
    all_streams_data = await response.json();
    isLoading = false; // Unlock so loadAndRenderNextBatch can run
    console.log(`Found ${all_streams_data.length} streams`);

    /* Sort all_streams_data by field added ascending */
    all_streams_data.sort(function(a, b){
        return b.added - a.added;
    });

    displayed_streams_count = 0; // Reset count for new search
    hasMoreData = true; // Assume there's more data initially
    document.getElementById("search_results").innerHTML = "<div class='row row-cols-1 row-cols-md-2 g-4'></div>"; // Clear existing cards and create the row container

    loadAndRenderNextBatch(); // Load the first batch
}

/**
 * Loads and renders the next batch of streams from all_streams_data.
 */
function loadAndRenderNextBatch() {
    if (isLoading || !hasMoreData) {
        return;
    }

    isLoading = true;

    const startIndex = displayed_streams_count;
    const endIndex = Math.min(displayed_streams_count + streamsPerLoad, all_streams_data.length);
    const streamsToRender = all_streams_data.slice(startIndex, endIndex);

    if (streamsToRender.length > 0) {
        appendCardsToDOM(streamsToRender);
        displayed_streams_count += streamsToRender.length;
    }

    if (displayed_streams_count >= all_streams_data.length) {
        hasMoreData = false;
    }

    isLoading = false;
}

/**
 * Appends a batch of stream cards to the DOM.
 * @param {Array} streams The array of stream objects to append.
 */
function appendCardsToDOM(streams) {
    var searchResultsRow = document.querySelector("#search_results .row");

    streams.forEach(item => {
        const newCard = buildMovieCard(item);
        if (newCard) {
            searchResultsRow.appendChild(newCard);
        }
        return true;
    });

    // Attach listeners to newly added elements (avoiding duplicates)
    searchResultsRow.querySelectorAll(".card-body:not(.has-listener)").forEach(el => {
        el.addEventListener('click', manage_card_events);
        el.classList.add('has-listener');
    });
    searchResultsRow.querySelectorAll(".play_movie:not(.has-listener)").forEach(el => {
        el.addEventListener('click', play_movie_action);
        el.classList.add('has-listener');
    });
    searchResultsRow.querySelectorAll(".download_movie:not(.has-listener)").forEach(el => {
        el.addEventListener('click', download_movie_action);
        el.classList.add('has-listener');
    });
    searchResultsRow.querySelectorAll(".open_series:not(.has-listener)").forEach(el => {
        el.addEventListener('click', open_series_action);
        el.classList.add('has-listener');
    });
}

/**
 * Get the stream URL from element and pass it to video player
 * @param {event} event Element event
 */
async function download_movie_action(event) {
    const btn = event.currentTarget;
    const movie_id = btn.getAttribute("movie_id");
    const originalHtml = btn.innerHTML;
    const downloadUrl = `${API_BASE_URL}/download_stream/movie/${movie_id}/`;

    console.log(`Initiating download for movie ID: ${movie_id}`);

    // Trigger the download. We do not await this because the backend call is blocking.
    fetch(downloadUrl).then(response => {
        if (!response.ok) console.error("Download request failed");
    }).catch(err => console.error("Error starting download:", err));

    // UI feedback: disable button and start polling
    btn.disabled = true;
    
    const progressInterval = setInterval(async () => {
        const progressUrl = `${API_BASE_URL}/get_download_progress/${movie_id}/`;
        try {
            const response = await fetch(progressUrl);
            const stats = await response.json();

            if (stats.Total > 0) {
                const percent = Math.min(100, Math.round((stats.Progress / stats.Total) * 100));
                btn.innerHTML = `<span style="font-size: 0.75rem;">${percent}%</span>`;

                if (percent >= 100) {
                    clearInterval(progressInterval);
                    btn.innerHTML = `<i class="bi bi-check-lg text-success"></i>`;
                    btn.disabled = false;
                    setTimeout(() => { btn.innerHTML = originalHtml; }, 5000);
                }
            }
        } catch (error) {
            console.error("Polling error:", error);
            clearInterval(progressInterval);
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    }, 1000);
}

/**
 * Get the stream URL from element and pass it to video player
 * @param {event} event Element event
 */
function play_movie_action(event) {

    var movie_url = event.currentTarget.attributes.movie_url.value;
    var movie_extension = event.currentTarget.attributes.movie_extension.value;
    var allowed_extensions = ["mp4", "mkv"];

    if (allowed_extensions.includes(movie_extension))
    {
        // If a player already exists, dispose of it to avoid conflicts
        if (videojs.getPlayers()['video_player_id']) {
            videojs('video_player_id').dispose();
            document.getElementById('video_container').innerHTML = '<video id="video_player_id" class="video-js vjs-theme-city"></video>';
        }

        var myPlayer = videojs('video_player_id', {liveui: true, controls: true, autoplay: true});
        myPlayer.aspectRatio('16:9');
        myPlayer.fluid(true);
        
        if (movie_extension == "mp4") {
            mime_type = "video/mp4";
        }
        else if (movie_extension == "mkv") {
            mime_type = "video/webm";
        }
        myPlayer.src({ type: mime_type, src: movie_url });

        var myVideoModal = new bootstrap.Modal(document.getElementById('myModal'));
        myVideoModal.show();
    }
    else
    {
        console.log("Video type not supported `" + movie_extension + '`');
        console.log("Video URL: `" + movie_url + "`")
    }
}

}
